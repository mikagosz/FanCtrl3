name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MicroPython (unix port)
        run: sudo apt-get update && sudo apt-get install -y micropython
      - name: Run every test that needs no hardware
        run: tests/run_all.sh
